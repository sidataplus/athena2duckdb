[project]
name = "athena2duckdb"
version = "0.1.0"
description = "Load OMOP Athena vocabulary exports into DuckDB"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Max Natthawut Adulyanukosol", email = "natthawut.adu@mahidol.ac.th" }
]
requires-python = ">=3.9"
keywords = ["omop", "athena", "ohdsi", "duckdb", "vocabulary"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "duckdb>=1.4.1",
]

[project.urls]
Homepage = "https://github.com/sidataplus/athena2duckdb"
Repository = "https://github.com/sidataplus/athena2duckdb"
Issues = "https://github.com/sidataplus/athena2duckdb/issues"

[project.scripts]
athena2duckdb = "athena2duckdb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.hatch.build]
exclude = [
    "/.DS_Store",
    "/.pytest_cache",
    "/.venv",
    "/data",
    "/dist",
    "/temp",
    "*.duckdb",
]

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    "RELEASING.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/athena2duckdb"]
